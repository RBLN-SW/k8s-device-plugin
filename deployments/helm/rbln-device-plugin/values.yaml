nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
selectorLabelsOverride: {}

imagePullSecrets: []
image:
  repository: rebellions/k8s-device-plugin
  pullPolicy: IfNotPresent
  tag: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

devicePlugin:
  priorityClassName: system-node-critical
  updateStrategy:
    type: RollingUpdate
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector:
    rebellions.ai/npu.present: "true"
  tolerations: []
  affinity: {}
  kubeletDevicePluginPath: /var/lib/kubelet/device-plugins
  cdiRoot: /var/run/cdi
  # On SR-IOV partitioned nodes, VFs are always advertised as
  # rebellions.ai/npu-vf<N> (N = VFs per PF; supported modes: 1 and 4),
  # regardless of this setting. No chart value is needed for VF mode; the
  # plugin detects partitioning from sysfs.
  useGenericResourceName: true
  containers:
    plugin:
      securityContext:
        privileged: true
      resources: {}
      healthcheckPort: 51515
