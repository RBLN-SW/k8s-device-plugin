name: release

# Publish from a version tag: vX.Y.Z-rcN -> Harbor, vX.Y.Z -> docker.io by
# digest. Tags are created by cut-release / tag-release only.
# Everything else lives in the release kit: https://github.com/RBLN-SW/cloud-component-release-kit

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write # GA deletes the "backport release-X.Y.Z" label
  statuses: read # the release kit reads the status reported by RNPM

jobs:
  release:
    uses: RBLN-SW/cloud-component-release-kit/.github/workflows/release.yaml@v1
    with:
      # Image names under the registry (HARBOR_REGISTRY / DOCKERHUB_REGISTRY),
      # space separated.
      images: k8s-device-plugin
      # Prefix of the GitHub release title.
      release_name: RBLN Device Plugin for NPUs
      # Helm chart directory, or remove both chart lines if there is no chart.
      chart_dir: deployments/helm/k8s-device-plugin-chart
      # yq expression that points the rc chart's image at Harbor, e.g.
      # '.image.registry = env(HARBOR_HOST)'.
      chart_rc_values: '.image.repository = strenv(HARBOR_REGISTRY) + "/k8s-device-plugin"'
    secrets: inherit

  # Validate the already-published image through RNPM. Its run overrides
  # disable rebuilding and target the release commit's rc-validation status.
  rc-validate:
    name: RNPM RC validation
    needs: release
    if: needs.release.outputs.kind == 'rc'
    runs-on: rbln-sw-k8s-general
    timeout-minutes: 180
    outputs:
      build_url: ${{ steps.validate.outputs.build_url }}
      run_id: ${{ steps.validate.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Trigger RNPM and wait for its RC verdict
        id: validate
        env:
          RNPM_URL: ${{ vars.RNPM_URL || 'https://rnpm.k8s.rebellions.in' }}
          RNPM_TOKEN: ${{ secrets.RNPM_TOKEN }}
          RNPM_RC_BUNDLE_ID: ${{ vars.RNPM_RC_BUNDLE_ID }}
          RC_TAG: ${{ github.ref_name }}
          RC_SHA: ${{ needs.release.outputs.sha }}
          RC_BRANCH: ${{ needs.release.outputs.branch }}
          HARBOR_REGISTRY: ${{ vars.CLOUD_COMPONENT_HARBOR_REGISTRY }}
          SENTINEL_REF: ${{ vars.RC_VALIDATION_SENTINEL_REF }}
          OPERATOR_REF: ${{ vars.RC_VALIDATION_OPERATOR_REF }}
        run: python3 .github/scripts/rnpm_rc.py
